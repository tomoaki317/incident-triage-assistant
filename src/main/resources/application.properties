# This free-input API is for local use; public demo input is not implemented.
server.address=127.0.0.1
# Framework DEBUG/TRACE logs can include parser details and exception messages.
logging.level.org.springframework.web=INFO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false
# Local Stub defaults; model token counting and real cost enforcement are not implemented.
triage.analysis.timeout=60s
triage.analysis.client-timeout=50s
triage.analysis.max-input-tokens=32000
triage.analysis.max-output-tokens=8000
triage.analysis.max-cost-usd=0.03
triage.analysis.max-execution-records=1000
